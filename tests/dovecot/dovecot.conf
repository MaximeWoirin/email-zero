# Config Dovecot minimale pour l'etage de tests CI (issue #17) : IMAP en clair
# sur le loopback du job, un compte statique factice (aucun secret reel),
# maildir monte depuis les fixtures de tests/fixtures/maildir/.
# Montee en lecture seule sur /etc/dovecot/dovecot.conf par le job
# `imap-dovecot` de .github/workflows/ci.yml (image dovecot/dovecot:2.3).

protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/mail/%u/Maildir

passdb {
  driver = static
  args = password=secret
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/mail/%u
}

namespace inbox {
  prefix =
  separator = /
  inbox = yes

  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  mailbox Trash {
    special_use = \Trash
  }
}
