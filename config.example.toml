# Email Zero — config d'exemple (committable, aucun secret).
# Copier en config.toml et remplir les noms de variables d'env.
# Les secrets ne sont JAMAIS dans ce fichier : uniquement des references.

[[mailbox]]
id = "orange"
host = "imap.orange.fr"
port = 993
username = "prenom.nom@orange.fr"
password_env = "EZ_ORANGE_PASSWORD"
tls = true
poll_interval_secs = 300

[[mailbox]]
id = "proton"
host = "127.0.0.1"               # via Proton Bridge
port = 1143
username = "prenom.nom@proton.me"
password_env = "EZ_PROTON_PASSWORD"
tls = false
poll_interval_secs = 300

[llm]
base_url = "https://litellm.example.com/v1"
api_key_env = "EZ_LLM_API_KEY"
model = "gpt-4o-mini"
temperature = 0.2
top_p = 1.0
max_tokens = 4096
reasoning_effort = "low"
timeout_secs = 90
batch_size = 15
rate_limit_per_min = 0

[llm.retry]
max_attempts = 3
backoff_base_secs = 5

[imap.retry]
max_attempts = 3
backoff_base_secs = 2

[triage]
action = "copy"                  # "copy" | "move"
confidence_threshold = 0.8       # sous ce seuil -> le mail reste dans INBOX
prompt_path = "prompts/triage.md"

[discovery]
interval_secs = 86400
sample_per_folder = 20
examples_in_prompt = 3
exclude_folders = ["Sent", "Drafts", "Trash", "Junk"]

# ---- State store ----
[store]
path = "data/email-zero.sqlite"  # cree avec son repertoire parent si absent

[log]
level = "info"
