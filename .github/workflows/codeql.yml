name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # scan hebdomadaire (dimanche 06:00 UTC) sur la branche par defaut
    - cron: "0 6 * * 0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: rust

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended : requetes orientees securite (secrets, TLS, etc.)
          queries: security-extended
          # fichier de config dedie : paths-ignore tests/ (fixtures factices)
          config: .github/codeql/codeql-config.yml
          # Rust : seul mode de build supporte par CodeQL. Extraction via
          # rust-analyzer (build.rs, macros), sans build complet. L'etape
          # autobuild est reservee aux langages a build et doit rester absente.
          build-mode: none

      # Prerequis runner pour l'extraction Rust : rustup + cargo
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
