name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # scan hebdomadaire (dimanche 06:00 UTC) sur la branche par defaut
    # (cron GitHub : 5 champs, pas de champ secondes)
    - cron: "0 6 * * 0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # permissions explicites minimales : lecture pour checkout, ecriture
      # des resultats SARIF. Un bloc permissions au niveau job remplace
      # toutes celles du workflow.
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Forme officielle CodeQL : la matrice doit etre une liste
        # (include). Une valeur scalaire 'language: rust' est rejetee
        # par le validateur de workflows GitHub :
        # "Unexpected value 'rust'" -> le workflow ne demarre jamais.
        include:
          - language: rust
            # Rust : seul mode de build supporte par CodeQL. Extraction
            # via rust-analyzer (build.rs, macros), sans build complet.
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      # codeql-action v4 : v3 est deprecare (decembre 2026) ; la documentation
      # du setup avance Rust (build-mode none) est documentee sur v4.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended : requetes orientees securite (secrets, TLS, etc.)
          queries: security-extended
          # Chemin du fichier de config (entree config-file, PAS config :
          # l'entree config attend une chaine YAML inline et prend le pas
          # sur config-file, ce qui provoquait l'erreur
          # "Cannot create property 'queries' on string '...'" ).
          # paths-ignore tests/ : fixtures avec identifiants factices.
          config-file: .github/codeql/codeql-config.yml

      # Prerequis runner pour l'extraction Rust : rustup + cargo
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
